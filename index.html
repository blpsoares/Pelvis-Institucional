  <!--
    F6.9 — CLS de fontes: fontes auto-hospedadas, ver o comentário completo
    em src/index.css (raiz do problema, as 3 opções avaliadas e por que
    escolhemos auto-hospedar + font-display: optional). O que muda aqui: os
    preloads apontavam pra fonts.gstatic.com (2 saltos: preconnect e depois
    o preload em si, e a folha do Google só descobria a URL final depois de
    outro round-trip a fonts.googleapis.com). Local, o preload scanner já
    lê a URL final no primeiro byte do HTML, sem DNS/TLS extra nem CSS
    intermediário — só os 2 arquivos usados acima da dobra nas 8 páginas
    (Source Sans 3 variável 400-700 e Taviraj 600, peso que os h1/h2/h3 já
    usam). O restante dos pesos (Source Sans 3 itálico 700, Taviraj
    400/500) é @font-face comum em src/index.css, sem preload — carregam
    quando o navegador encontrar o primeiro uso deles, como qualquer fonte
    não crítica.
  -->
  <link rel="preload" as="font" type="font/woff2" crossorigin
    href="/fonts/source-sans-3-latin-400-700-normal.woff2" />
  <link rel="preload" as="font" type="font/woff2" crossorigin
    href="/fonts/taviraj-latin-600-normal.woff2" />

  <!--
    Sem JavaScript, o conteúdo estava no HTML mas ficava INVISÍVEL: as
    microanimações de entrada (src/components/boxAnimation) partem de
    `[data-anime] { opacity: 0 }` e só recebem a classe `.animate` pelo listener
    de scroll, que exige JS. Isso valia para as 8 páginas e contrariava o item de
    aceite "conteúdo presente no HTML sem JS". Este <noscript> só é aplicado
    quando o JS está desligado — com JS ligado a renderização é idêntica.
  -->
  <noscript>
    <style>
      [data-anime] {
        opacity: 1 !important;
        scale: 1 !important;
        transform: none !important;
      }
    </style>
  </noscript>
